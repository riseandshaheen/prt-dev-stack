<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRT Dev Stack</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/">PRT Dev Stack</a>
    <div class="chainread" id="chainread"><span>Connecting…</span></div>

      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>
  <main id="main"><p class="muted">Loading the stack…</p></main>
  <script src="/app.js"></script>

</html>
