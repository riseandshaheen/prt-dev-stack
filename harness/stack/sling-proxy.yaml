# Route the stack's sling through the harness fault proxy (harness/qa/rpc_proxy.py on host port 18620).
#   docker compose -f sling/compose.yaml -f harness/stack/sling-proxy.yaml up -d
services:
  node:
    command:
      - --app-address
      - ${APP_ADDRESS:-0x6c2E2F9665b8f941aA8D94ea3f0287F7884a6146}
      - --machine-path
      - /machine
      - --web3-rpc-url
      - http://host.docker.internal:18620
      - --web3-chain-id
      - "31337"
      - --state-dir
      - /state
      - --sleep-duration-seconds
      - "5"
      - pk
      - --web3-private-key
      - ${PRIVATE_KEY:-0x4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356}
