name: prt-sling

# Sling node from dave v3.0.0-alpha.6 (cartesi-sling-node, Cartesi Machine v0.22).
# The data directory format changed from alpha.5, so the volume has a new name:
# an alpha.5 directory makes the node exit 40.
services:
  node:
    image: ghcr.io/riseandshaheen/sling-node:3.0.0-alpha.6
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MACHINE_PATH:-../echo/machine-image-rootfs}:/machine:ro
      - sling-state-alpha6:/state
    environment:
      # The pk signer reads its key from the environment; alpha.6 has no key flag.
      CARTESI_SLING_AUTH_PRIVATE_KEY: ${PRIVATE_KEY:-0x4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356}
      RUST_LOG: ${RUST_LOG:-info}
    command:
      - --app-address
      - ${APP_ADDRESS:-0x53563a918B43Ca40FD966Ea1f065072383f33DB7}
      - --template-path
      - /machine
      - --blockchain-http-endpoint
      - http://host.docker.internal:8545
      - --blockchain-id
      - "31337"
      - --data-dir
      - /state
      - --polling-interval
      - "5"
      - pk

volumes:
  sling-state-alpha6:
